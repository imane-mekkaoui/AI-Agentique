[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ap5-agentique"
version = "0.1.0"
description = "Activité pratique N°5 — Agentique AI, LangChain, LangGraph, MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0.0",
    "ddgs>=9.0.0",
    "ipykernel>=7.0.0",
    "langchain>=1.0.0",
    "langchain-chroma>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-experimental>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-ollama>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.6.0",
    "mcp>=1.12.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
    "tavily-python>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ap5"]

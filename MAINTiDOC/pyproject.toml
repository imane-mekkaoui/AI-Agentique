[project]
name = "maintidoc"
version = "0.1.0"
description = "MAINTiDOC — assistant documentaire de maintenance (étape 3 : LangGraph + MCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "httpx>=0.27",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
    "datasets>=3.0",
    "accelerate>=1.1.0",
    "langgraph>=0.6.0",
    "mcp>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
